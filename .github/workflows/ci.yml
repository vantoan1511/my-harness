name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build & packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify shell script syntax (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh

      - name: Verify PowerShell script syntax (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell parse errors found: $errors"
            exit 1
          }

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Verify Package Build (sdist & wheel)
        run: |
          python -m build
